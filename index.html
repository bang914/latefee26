<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지각비 장부</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d2330;--mu:#6b7280;--ln:#e3e1da;--blue:#2563eb;--red:#dc2626;--pur:#7c3aed;--bt:#e8eefc;--rt:#fde8e8;--pt:#efe8fd;--gt:#dcfce7;--gn:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--sf:#1e222d;--tx:#eef0f5;--mu:#9aa3b2;--ln:#2e3341;--blue:#6b9bff;--red:#ff7b7b;--pur:#b79cff;--bt:#1d2a4d;--rt:#4a2326;--pt:#34285a;--gt:#173a26;--gn:#6ee7a0}}
:root[data-theme="dark"]{--bg:#14171f;--sf:#1e222d;--tx:#eef0f5;--mu:#9aa3b2;--ln:#2e3341;--blue:#6b9bff;--red:#ff7b7b;--pur:#b79cff;--bt:#1d2a4d;--rt:#4a2326;--pt:#34285a;--gt:#173a26;--gn:#6ee7a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.hero{min-height:42svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 32px;background:linear-gradient(180deg,var(--bt),transparent)}
.hero{position:relative}
.acct{position:absolute;top:12px;right:12px;font-size:16px;font-weight:800;padding:8px 16px;min-height:42px;border-radius:21px;background:linear-gradient(135deg,#f9d976,#e0a82e);border:1px solid #c58f1c;color:#3d2a00;box-shadow:0 2px 8px rgba(197,143,28,.4)}
.pop{position:absolute;top:64px;right:12px;z-index:5;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(30,40,80,.18);text-align:center;cursor:pointer}
.pop b{display:block;font-size:12px;color:var(--mu);font-weight:600}
.pop span{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ttl{font-size:22px;font-weight:800;margin:0 0 14px;letter-spacing:-.02em}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:22px 24px;text-align:center;width:min(320px,100%);box-shadow:0 8px 24px rgba(30,40,80,.10)}
.box p{margin:0;color:var(--mu);font-size:14px}
.total{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:4px 0;font-variant-numeric:tabular-nums}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:12px;background:var(--ln)}
.bar i{display:block;height:100%}
main{max-width:640px;margin:0 auto;padding:0 16px 80px;display:flex;flex-direction:column}
h2{font-size:19px;margin:32px 0 12px;padding-left:10px;border-left:4px solid var(--blue);line-height:1.2}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(30,40,80,.05)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-weight:700;font-size:16px}
.amt{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.sub{color:var(--mu);font-size:13px}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button{transition:transform .1s}
button:active{transform:scale(.97)}
button.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.d{color:var(--red)}
input{border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;min-height:38px;border-radius:19px}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);text-shadow:0 0 .5px currentColor,0 0 .5px currentColor}
.tiers{display:flex;gap:6px}
.tiers button{flex:1;font-weight:700;font-size:13px;line-height:1.3;padding:6px 4px}
.tiers button.on{outline:2px solid currentColor}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.t1{background:var(--bt);color:var(--blue)}.t2{background:var(--rt);color:var(--red)}.t3{background:var(--pt);color:var(--pur)}
.rec{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}
.rec .b{display:flex;gap:4px}
.rec button,.mini{padding:4px 10px;min-height:32px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mu);margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:12px;color:var(--mu);padding:4px 0}
.day{min-height:64px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:3px;font-size:12px;cursor:pointer;overflow:hidden;text-align:left;display:block}
.day.sel{outline:2px solid var(--tx)}
.day.today .n{font-weight:800;text-decoration:underline}
.day .n{color:var(--mu)}
.chip{display:block;font-size:10px;line-height:1.3;border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700}
.empty{color:var(--mu);font-size:14px;padding:8px 0}
[hidden]{display:none!important}
body:not(.edit) .eo,body:not(.edit) .rec .b{display:none}
.owe{margin-top:12px;border-top:1px dashed var(--ln);padding-top:8px;text-align:left}
.orow{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.orow{align-items:center;gap:6px}.orow .on{flex:1;text-align:left}.ov{font-weight:700}.ob{display:flex;gap:4px}.ob button{padding:2px 6px;min-height:28px;font-size:12px}.ck{background:#16a34a;color:#fff;border-color:#16a34a;font-weight:800}body:not(.edit) .ob{display:none}.edit .box{width:min(400px,100%)}
.owet{font-size:12px;color:var(--mu);margin-bottom:2px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dbox{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;width:min(320px,100%);display:grid;gap:12px;font-weight:700}
.drow{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90%}
.msw{display:flex;align-items:center;justify-content:space-between}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;width:150px;border:1px solid var(--ln);border-radius:21px;background:var(--bg);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);background:var(--tx);border-radius:19px;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.seg.auto .th{transform:translateX(100%)}
.seg span{position:relative;z-index:1;text-align:center;padding:8px 0;font-weight:700;font-size:14px;color:var(--tx);transition:color .28s}
.seg:not(.auto) span:nth-of-type(1){color:var(--bg)}
.seg.auto span:nth-of-type(2){color:var(--bg)}
.seg:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.autoinfo{background:var(--bg);border:1px dashed var(--ln);border-radius:10px;padding:10px 12px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.seg .th,.seg span{transition:none}}
.pd{background:var(--gt);color:var(--gn)}
.trophy{position:absolute;top:12px;left:12px;width:46px;height:46px;min-height:46px;border-radius:50%;padding:0;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--sf);border:1px solid var(--ln);box-shadow:0 2px 8px rgba(30,40,80,.18)}

.ahead{max-width:420px;margin:0 auto 18px;display:flex;align-items:center;gap:8px}
#award button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);color:#f3efe3}
.aclose{width:44px;min-height:44px;height:44px;border-radius:50%;padding:0;flex:none}
.atabs{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.atabs button{font-weight:700;min-height:44px;border-radius:22px}
#award .atabs button.on{background:#e3c06a;border-color:#e3c06a;color:#231a00}
.abody{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.atitle{text-align:center;font-size:24px;font-weight:700;letter-spacing:.02em;color:#ecd48f;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;text-shadow:0 2px 12px rgba(236,212,143,.25)}
.asub{text-align:center;color:#9aa0b4;font-size:14px;margin-top:-6px;letter-spacing:.04em}
.ac{width:100%;border-radius:10px;display:flex;align-items:center;gap:18px;padding:14px 20px;overflow:hidden;font-variant-numeric:tabular-nums;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,#1e2131,#14161f);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}
.ac .amd{flex:none;display:flex;align-items:center}
.ac .amd svg{width:auto;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.55))}
.ac .atx{min-width:0;display:flex;flex-direction:column;gap:3px}
.ac .ar{font-size:12px;font-weight:700;letter-spacing:.14em;opacity:.75}
.ac .an{font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac .ad{font-weight:600;opacity:.8}
.ac.r1{aspect-ratio:6/4;border:1.5px solid #c9a24a;background:linear-gradient(145deg,#2d2613,#17140b);color:#f2dc92;box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 26px rgba(201,162,74,.18),inset 0 1px 0 rgba(255,236,170,.25)}
.ac.r1 .amd svg{height:118px}.ac.r1 .an{font-size:36px}.ac.r1 .ad{font-size:17px}
.ac.r2{aspect-ratio:6/3;border-color:#aab2c0;background:linear-gradient(145deg,#282c37,#15171d);color:#e6e9ef;box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16)}
.ac.r2 .amd svg{height:92px}.ac.r2 .an{font-size:30px}.ac.r2 .ad{font-size:15px}
.ac.r3{aspect-ratio:6/2;border-color:#b0784a;background:linear-gradient(145deg,#2e2119,#16100c);color:#efcfb0;box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,214,176,.15)}
.ac.r3 .amd svg{height:66px}.ac.r3 .an{font-size:24px}.ac.r3 .ad{font-size:14px}
.ac.r3 .ar{font-size:11px}
.ac.r4{aspect-ratio:6/1;padding:0 16px;gap:12px;color:#d9dce6;box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05)}
.ac.r4 .ar{min-width:56px;opacity:.65;font-size:13px;letter-spacing:.06em}
.ac.r4 .an{font-size:17px;flex:1}
.ac.r4 .ad{font-size:13px;white-space:nowrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2}
#award .popb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;min-height:58px;border-radius:50%;padding:0;font-size:28px;line-height:1;z-index:3;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff1b8 0%,#f0c24a 45%,#b8841c 100%);border:1px solid #e9c25f;color:#3d2a00;box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 18px rgba(240,194,74,.45),inset 0 1px 0 rgba(255,255,255,.7)}
#award .popb:active{transform:scale(.9)}
.popb.pl{left:16px}.popb.pr{right:16px}
#award .popb.ps{left:50%;transform:translateX(-50%);width:auto;padding:0 20px;border-radius:29px;font-size:15px;font-weight:800;gap:6px;white-space:nowrap;letter-spacing:-.01em}
#award .popb.ps:active{transform:translateX(-50%) scale(.94)}
#award .popb.ps.on{background:linear-gradient(145deg,#3a2a08,#1a1304);color:#f2dc92;border-color:#c9a24a}
.popb span{display:inline-block}.popb.pr span{transform:scaleX(-1)}
.aempty{text-align:center;color:#9aa0b4;padding:28px 8px;border:1px dashed rgba(255,255,255,.18);border-radius:10px}

</head>

function sidx(s){var i=SEED.indexOf(s.name);return i<0?999:i}
function norm(){
  D.students=D.students||[];D.recs=D.recs||[];D.pays=D.pays||[];
  (function(){var mp={},np=[];D.pays.forEach(function(p){var k=p.sid+"|"+p.date;if(mp[k]){mp[k].amt+=p.amt;mp[k].ta=(mp[k].ta||0)+(p.ta||0)}else{mp[k]={id:p.id,sid:p.sid,date:p.date,amt:p.amt,ta:p.ta||0};np.push(mp[k])}});D.pays=np})();
  (function(){var mp={},np=[];D.pays.forEach(function(p){var k=p.sid+"|"+p.date;if(mp[k]){mp[k].amt+=p.amt;mp[k].ta=(mp[k].ta||0)+(p.ta||0)}else{mp[k]={id:p.id,sid:p.sid,date:p.date,amt:p.amt,ta:p.ta||0};np.push(mp[k])}});D.pays=np})();
  if(!D.m){D.m=1;var g=D.students.filter(function(s){return s.name==="가률"}).map(function(s){return s.id});D.students=D.students.filter(function(s){return g.indexOf(s.id)<0});D.recs=D.recs.filter(function(r){return g.indexOf(r.sid)<0});D.students.forEach(function(s){if(s.name==="서로")s.name="로"})}
  if(!D.m2){D.m2=1;if(!D.students.some(function(s){return s.name==="주원"}))D.students.push({id:"sjw1",name:"주원"})}
  D.students=D.students.map(function(s,i){return{s:s,i:i}}).sort(function(a,b){return sidx(a.s)-sidx(b.s)||a.i-b.i}).map(function(x){return x.s});
}

norm();

function save(){

function initSync(){
  if(!FBON){setSync("· 이 기기에만 저장 (Firebase 미설정)");return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    FB=firebase.database().ref("ledger");
    FB.on("value",function(snap){
      var v=snap.val();
      if(v){D=v;norm();fbOk=true;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
      else{fbOk=true;seedIfEmpty();norm();save()}
      setSync("· 🟢 실시간 연결됨");render()
    },function(){setSync("· 🔴 연결 실패 (읽기 권한 확인)")});
    setTimeout(function(){if(!fbOk)setSync("· 🟡 연결이 오래 걸려요 (databaseURL·규칙 확인)")},8000);
    firebase.database().ref(".info/connected").on("value",function(s){if(fbOk)setSync(s.val()?"· 🟢 실시간 연결됨":"· 🟡 오프라인")});

}

  var p=(t||"").split(":").map(Number),sec=(p[0]||0)*3600+(p[1]||0)*60+(p[2]||0)-28800;
  if(sec<60)return {fee:0,cls:"",label:"지각 아님"};
  if(sec<360)return {fee:2000,cls:"t1",label:"2,000원"};

  return {fee:4000,cls:"t3",label:"4,000원"}}

function renderCal(){

    h+='<button class="day'+(ds===today?" today":"")+(ds===selDate?" sel":"")+'" onclick="selDay(\''+ds+'\')"><span class="n">'+d+'</span>'
