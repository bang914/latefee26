<!DOCTYPE html>
<html lang="ko">
<head>

<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d2330;--mu:#6b7280;--ln:#e3e1da;--blue:#2563eb;--red:#dc2626;--pur:#7c3aed;--bt:#e8eefc;--rt:#fde8e8;--pt:#efe8fd;--gt:#dcfce7;--gn:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--sf:#1e222d;--tx:#eef0f5;--mu:#9aa3b2;--ln:#2e3341;--blue:#6b9bff;--red:#ff7b7b;--pur:#b79cff;--bt:#1d2a4d;--rt:#4a2326;--pt:#34285a;--gt:#173a26;--gn:#6ee7a0}}
:root[data-theme="dark"]{--bg:#14171f;--sf:#1e222d;--tx:#eef0f5;--mu:#9aa3b2;--ln:#2e3341;--blue:#6b9bff;--red:#ff7b7b;--pur:#b79cff;--bt:#1d2a4d;--rt:#4a2326;--pt:#34285a;--gt:#173a26;--gn:#6ee7a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.hero{min-height:42svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 32px;background:linear-gradient(180deg,var(--bt),transparent)}

.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:12px;background:var(--ln)}
.bar i{display:block;height:100%}
main{max-width:640px;margin:0 auto;padding:0 16px 80px;display:flex;flex-direction:column}
h2{font-size:19px;margin:32px 0 12px;padding-left:10px;border-left:4px solid var(--blue);line-height:1.2}

.amt{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}

button,input{font:inherit;color:inherit}
button{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button{transition:transform .1s}
button:active{transform:scale(.97)}
button.p{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.d{color:var(--red)}
input{border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;min-height:38px;border-radius:19px}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx);text-shadow:0 0 .5px currentColor,0 0 .5px currentColor}
.tiers{display:flex;gap:6px}
.tiers button{flex:1;font-weight:700;font-size:13px;line-height:1.3;padding:6px 4px}
.tiers button.on{outline:2px solid currentColor}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.t1{background:var(--bt);color:var(--blue)}.t2{background:var(--rt);color:var(--red)}.t3{background:var(--pt);color:var(--pur)}
.rec{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}
.rec .b{display:flex;gap:4px}
.rec button,.mini{padding:4px 10px;min-height:32px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mu);margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:12px;color:var(--mu);padding:4px 0}
.day{min-height:64px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:3px;font-size:12px;cursor:pointer;overflow:hidden;text-align:left;display:block}
.day.sel{outline:2px solid var(--tx)}
.day.today .n{font-weight:800;text-decoration:underline}
.day .n{color:var(--mu)}
.chip{display:block;font-size:10px;line-height:1.3;border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700}
.empty{color:var(--mu);font-size:14px;padding:8px 0}
[hidden]{display:none!important}
body:not(.edit) .eo,body:not(.edit) .rec .b{display:none}
.owe{margin-top:12px;border-top:1px dashed var(--ln);padding-top:8px;text-align:left}
.orow{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.orow{align-items:center;gap:6px}.orow .on{flex:1;text-align:left}.ov{font-weight:700}.ob{display:flex;gap:4px}.ob button{padding:2px 6px;min-height:28px;font-size:12px}.ck{background:#16a34a;color:#fff;border-color:#16a34a;font-weight:800}body:not(.edit) .ob{display:none}.edit .box{width:min(400px,100%)}
.owet{font-size:12px;color:var(--mu);margin-bottom:2px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dbox{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;width:min(320px,100%);display:grid;gap:12px;font-weight:700}
.drow{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90%}

.seg span{position:relative;z-index:1;text-align:center;padding:8px 0;font-weight:700;font-size:14px;color:var(--tx);transition:color .28s}
.seg:not(.auto) span:nth-of-type(1){color:var(--bg)}

.seg:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.autoinfo{background:var(--bg);border:1px dashed var(--ln);border-radius:10px;padding:10px 12px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.seg .th,.seg span{transition:none}}
.pd{background:var(--gt);color:var(--gn)}
</style>
</head>
<body>
<section class="hero">
  <button class="acct" onclick="var p=document.getElementById('pop');p.hidden=!p.hidden">영완쌤 계좌</button>
  <div class="pop" id="pop" hidden><b>영완쌤 계좌</b><span>신한 110-358-985408</span><button class="mini" style="margin-top:8px;width:100%" onclick="copyAcct()">복사하기</button></div>

</main>
<div id="dlg" hidden><div class="dbox"><div id="dmsg"></div><input id="din" hidden><div class="drow"><button onclick="dclose(false)">취소</button><button class="p" onclick="dclose(true)">확인</button></div></div></div>
<div id="toast" hidden></div>

<script>
/* ====== 1) Firebase 설정: 콘솔에서 복사한 값으로 교체하세요 ====== */
var FIREBASE_CONFIG={
  apiKey:"AIzaSyBvYBQN1f0wk7LRO3xlvlkIpodGRIPRPTU",
  authDomain:"latefee-80e5c.firebaseapp.com",
  databaseURL:"https://latefee-80e5c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"latefee-80e5c",
  appId:"1:164245221752:web:3db5c234f232a5698ad88d"
};
/* ====== 2) 수정 비밀번호 ====== */
var EDIT_PW="103_26";
/* ================================================================ */
 
var KEY="latefee_v2",SEED="우현,건희,지호,건우,경수,민재,민준,시윤,주호,지환,하람,주원,현우,형민,시우,로,백호,재문,준기,현수,윤우,영훈,유준,윤호,우상,재이".split(","),
D={students:[],recs:[]},editId=null,view=new Date(),selDate=null,sel={},open={},
FB=null,fbOk=false,FBON=false;
view.setDate(1);
try{var s0=localStorage.getItem(KEY);if(s0)D=JSON.parse(s0)}catch(e){}
FBON=FIREBASE_CONFIG.apiKey!=="YOUR_API_KEY"&&typeof firebase!=="undefined";
 
function seedIfEmpty(){if(!D.students.length&&!D.recs.length){D.students=SEED.map(function(n,i){return{id:"s"+i,name:n}})}}
function sidx(s){var i=SEED.indexOf(s.name);return i<0?999:i}
function norm(){
  D.students=D.students||[];D.recs=D.recs||[];D.pays=D.pays||[];
  (function(){var mp={},np=[];D.pays.forEach(function(p){var k=p.sid+"|"+p.date;if(mp[k]){mp[k].amt+=p.amt;mp[k].ta=(mp[k].ta||0)+(p.ta||0)}else{mp[k]={id:p.id,sid:p.sid,date:p.date,amt:p.amt,ta:p.ta||0};np.push(mp[k])}});D.pays=np})();
  (function(){var mp={},np=[];D.pays.forEach(function(p){var k=p.sid+"|"+p.date;if(mp[k]){mp[k].amt+=p.amt;mp[k].ta=(mp[k].ta||0)+(p.ta||0)}else{mp[k]={id:p.id,sid:p.sid,date:p.date,amt:p.amt,ta:p.ta||0};np.push(mp[k])}});D.pays=np})();
  if(!D.m){D.m=1;var g=D.students.filter(function(s){return s.name==="가률"}).map(function(s){return s.id});D.students=D.students.filter(function(s){return g.indexOf(s.id)<0});D.recs=D.recs.filter(function(r){return g.indexOf(r.sid)<0});D.students.forEach(function(s){if(s.name==="서로")s.name="로"})}
  if(!D.m2){D.m2=1;if(!D.students.some(function(s){return s.name==="주원"}))D.students.push({id:"sjw1",name:"주원"})}
  D.students=D.students.map(function(s,i){return{s:s,i:i}}).sort(function(a,b){return sidx(a.s)-sidx(b.s)||a.i-b.i}).map(function(x){return x.s});
}
if(!FBON)seedIfEmpty();
norm();
 
function setSync(t){var e=document.getElementById("sync");if(e)e.textContent=t}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
  if(FB&&fbOk){FB.set(JSON.parse(JSON.stringify(D))).catch(function(){note("저장 실패: 권한/네트워크를 확인하세요")})}
}
function initSync(){
  if(!FBON){setSync("· 이 기기에만 저장 (Firebase 미설정)");return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    FB=firebase.database().ref("ledger");
    FB.on("value",function(snap){
      var v=snap.val();
      if(v){D=v;norm();fbOk=true;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
      else{fbOk=true;seedIfEmpty();norm();save()}
      setSync("· 🟢 실시간 연결됨");render()
    },function(){setSync("· 🔴 연결 실패 (읽기 권한 확인)")});
    setTimeout(function(){if(!fbOk)setSync("· 🟡 연결이 오래 걸려요 (databaseURL·규칙 확인)")},8000);
    firebase.database().ref(".info/connected").on("value",function(s){if(fbOk)setSync(s.val()?"· 🟢 실시간 연결됨":"· 🟡 오프라인")});
  }catch(e){FB=null;setSync("· 🔴 Firebase 설정 오류")}
}
 
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function won(n){return n.toLocaleString("ko-KR")+"원"}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tier(t){
  var p=(t||"").split(":").map(Number),sec=(p[0]||0)*3600+(p[1]||0)*60+(p[2]||0)-28800;
  if(sec<60)return {fee:0,cls:"",label:"지각 아님"};
  if(sec<360)return {fee:2000,cls:"t1",label:"2,000원"};
  if(sec<600)return {fee:3000,cls:"t2",label:"3,000원"};
  return {fee:4000,cls:"t3",label:"4,000원"}}
function sname(id){var x=D.students.find(function(s){return s.id===id});return x?x.name:"(삭제됨)"}
var unlocked=false;
function gate(fn){if(unlocked){fn();return}dlg("비밀번호를 입력하세요","",function(v){if(v===EDIT_PW){unlocked=true;note("수정이 열렸어요");render();fn()}else note("비밀번호가 틀렸어요")},true)}
function stuSum(s){return Math.max(0,D.recs.filter(function(r){return r.sid===s.id}).reduce(function(a,r){return a+tier(r.time).fee},0)+(s.adj||0))}
function logPay(sid,amt,ta){D.pays=D.pays||[];var dd=ymd(new Date()),e=D.pays.find(function(p){return p.sid===sid&&p.date===dd});if(e){e.amt+=amt;e.ta=(e.ta||0)+(ta||0)}else D.pays.push({id:uid(),sid:sid,date:dd,amt:amt,ta:ta||0})}
function trimPay(sid,x){var a=D.pays||[];for(var i=a.length-1;i>=0&&x>0;i--){if(a[i].sid!==sid)continue;var t=Math.min(x,a[i].amt);a[i].amt-=t;x-=t;if(a[i].amt<=0)a.splice(i,1)}}
function delPay(id){gate(function(){dlg("이 납부 기록을 취소할까요? (남은 금액에 다시 더해져요)",null,function(){var pe=(D.pays||[]).find(function(x){return x.id===id});if(!pe)return;var s=D.students.find(function(x){return x.id===pe.sid});if(s)s.adj=(s.adj||0)+pe.amt;D.tot=Math.max(0,(D.tot||0)-(pe.ta||0));D.pays=D.pays.filter(function(x){return x.id!==id});save();render()})})}
function payChips(ds){var m={},o=[];(D.pays||[]).forEach(function(p){if(p.date===ds){if(!(p.sid in m)){m[p.sid]=0;o.push(p.sid)}m[p.sid]+=p.amt}});return o.filter(function(k){return m[k]>0}).map(function(k){return '<span class="chip pd">'+esc(sname(k))+' '+m[k].toLocaleString("ko-KR")+'</span>'}).join("")}
function pay(id,n){gate(function(){var s=D.students.find(function(x){return x.id===id}),a=Math.min(n,stuSum(s));if(a<=0)return;s.adj=(s.adj||0)-a;D.tot=(D.tot||0)+a;logPay(id,a,a);save();render()})}
function payAll(id){pay(id,stuSum(D.students.find(function(x){return x.id===id})))}
function editTot(){gate(function(){dlg("총 지각비 (숫자 입력)",String(D.tot||0),function(v){var n=parseInt(String(v).replace(/[^0-9]/g,""),10);if(!isNaN(n)){D.tot=n;save();render()}},"num")})}
function toggleLock(){if(unlocked){unlocked=false;resetForm();note("잠겼어요");render()}else gate(function(){})}
function adj(id,d){gate(function(){var s=D.students.find(function(x){return x.id===id}),pre=stuSum(s);s.adj=(s.adj||0)+d;if(d<0){var a=Math.min(-d,pre);if(a>0)logPay(id,a,0)}else trimPay(id,d);save();render()})}
function addStudent(){gate(addStudent0)}
function addStudent0(){var i=document.getElementById("newName"),v=i.value.trim();if(!v)return;D.students.push({id:uid(),name:v});i.value="";save();render()}
function copyAcct(){var t="110-358-985408",ok=false;
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(a);note(ok?"계좌번호를 복사했어요":"복사가 안 돼요. 번호를 길게 눌러 복사해 주세요")}
  try{navigator.clipboard.writeText(t).then(function(){note("계좌번호를 복사했어요")},fb)}catch(e){fb()}}
var dcb=null;
function dlg(msg,val,cb,pw){document.getElementById("dmsg").textContent=msg;var i=document.getElementById("din");i.type=pw===true?"password":"text";i.inputMode=pw==="num"?"numeric":"";i.hidden=val==null;if(val!=null)i.value=val;dcb=cb;document.getElementById("dlg").hidden=false;if(val!=null)i.focus()}
function dclose(ok){var v=document.getElementById("din").value,f=dcb;dcb=null;document.getElementById("dlg").hidden=true;if(ok&&f)f(v)}
function note(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(note.t);note.t=setTimeout(function(){t.hidden=true},2500)}
function renameStudent(id){gate(function(){renameStudent0(id)})}
function renameStudent0(id){var x=D.students.find(function(s){return s.id===id});dlg("이름 변경",x.name,function(v){v=v.trim();var y=D.students.find(function(s){return s.id===id});if(v&&y){y.name=v;save();render()}})}
function delStudent(id){gate(function(){delStudent0(id)})}
function delStudent0(id){dlg(sname(id)+" 학생과 지각 기록을 모두 삭제할까요?",null,function(){D.students=D.students.filter(function(s){return s.id!==id});D.recs=D.recs.filter(function(r){return r.sid!==id});D.pays=(D.pays||[]).filter(function(p){return p.sid!==id});delete sel[id];save();render()})}
function pick(id){if(editId)sel={};sel[id]=!sel[id];renderChips();upBtn()}
function setT(t){document.getElementById("ft").value=t;upPrev()}
function upBtn(){var n=Object.keys(sel).filter(function(k){return sel[k]}).length;document.getElementById("saveBtn").textContent=editId?"수정 저장":(n?n+"명 기록하기":"기록하기")}
function saveRec(){
  var ids=Object.keys(sel).filter(function(k){return sel[k]}),d=document.getElementById("fd").value,t=document.getElementById("ft").value;
  if(auto&&!editId){var nw=new Date();d=ymd(nw);t=nowT(nw)}
  if(!ids.length||!d||!t){note("학생, 날짜, 시간을 모두 정해 주세요.");return}
  if(tier(t).fee===0){note("8시 1분 이후만 지각으로 기록됩니다.");return}
  if(editId){var r=D.recs.find(function(x){return x.id===editId});if(!r){note("이미 삭제된 기록이에요");resetForm();return}r.sid=ids[0];r.date=d;r.time=t}
  else ids.forEach(function(id){D.recs.push({id:uid(),sid:id,date:d,time:t})});
  selDate=d;var dt=new Date(d+"T00:00:00");view=new Date(dt.getFullYear(),dt.getMonth(),1);
  save();resetForm();render()}
function editRec(id){gate(function(){editRec0(id)})}
function editRec0(id){var r=D.recs.find(function(x){return x.id===id});editId=id;sel={};sel[r.sid]=true;
  document.getElementById("fd").value=r.date;document.getElementById("ft").value=r.time.length===5?r.time+":00":r.time;
  document.getElementById("formTitle").textContent="지각 기록 수정 중";document.getElementById("cancelBtn").hidden=false;
  applyMode();renderChips();upPrev();upBtn();document.getElementById("chips").scrollIntoView({block:"center"})}
function delRec(id){gate(function(){delRec0(id)})}
function delRec0(id){dlg("이 지각 기록을 삭제할까요?",null,function(){D.recs=D.recs.filter(function(r){return r.id!==id});if(editId===id)resetForm();save();render()})}
function resetForm(){editId=null;sel={};document.getElementById("formTitle").textContent="지각한 학생을 눌러 고르세요 (여러 명 가능)";document.getElementById("cancelBtn").hidden=true;document.getElementById("ft").value="08:03:00";document.getElementById("fd").value=ymd(new Date());applyMode();renderChips();upPrev();upBtn()}
function upPrev(){var t=tier(document.getElementById("ft").value),e=document.getElementById("prev");e.innerHTML=t.fee?'적용: <span class="tag '+t.cls+'">'+t.label+'</span>':'8시 1분 이후만 지각이에요'}
function mv(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCal()}
function recLine(r){var t=tier(r.time);return '<div class="rec"><span>'+r.date.slice(5).replace("-","/")+" "+r.time.slice(0,8)+' <span class="tag '+t.cls+'">'+t.label+'</span></span><span class="b"><button onclick="editRec(\''+r.id+'\')">수정</button><button class="d" onclick="delRec(\''+r.id+'\')">삭제</button></span></div>'}
function togg(id){open[id]=!open[id];renderStudents()}
function renderChips(){document.getElementById("chips").innerHTML=D.students.map(function(s){return '<button class="'+(sel[s.id]?"on":"")+'" onclick="pick(\''+s.id+'\')">'+esc(s.name)+'</button>'}).join("")}
function renderStudents(){
  var h="";
  D.students.forEach(function(s){
    var rs=D.recs.filter(function(r){return r.sid===s.id}).sort(function(a,b){return b.date.localeCompare(a.date)});
    var sum=stuSum(s);
    h+='<div class="card"><div class="row"><div><span class="name">'+esc(s.name)+'</span> <span class="sub">'+rs.length+'회</span></div><div class="row">'+(unlocked?'<button class="mini" onclick="adj(\''+s.id+'\',-1000)">−1,000</button>':'')+'<span class="amt">'+won(sum)+'</span>'+(unlocked?'<button class="mini" onclick="adj(\''+s.id+'\',1000)">+1,000</button>':'')+'<button class="mini" onclick="togg(\''+s.id+'\')">'+(open[s.id]?"닫기":"기록")+'</button></div></div>';
    if(open[s.id]){h+=rs.length?rs.map(recLine).join(""):'<div class="empty">지각 기록이 없어요.</div>';
      if(s.adj)h+='<div class="rec"><span>금액 조정 '+(s.adj>0?"+":"")+won(s.adj)+'</span></div>';
      h+='<div class="rec"><span></span><span class="b"><button onclick="renameStudent(\''+s.id+'\')">이름 변경</button><button class="d" onclick="delStudent(\''+s.id+'\')">학생 삭제</button></span></div>'}
    h+='</div>'});
  document.getElementById("students").innerHTML=h}
function renderCal(){
  var y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=ymd(new Date());
  document.getElementById("mt").textContent=y+"년 "+(m+1)+"월";
  var h=["일","월","화","수","목","금","토"].map(function(d){return '<div class="dow">'+d+'</div>'}).join("");
  for(var i=0;i<first;i++)h+="<div></div>";
  for(var d=1;d<=days;d++){
    var ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var rs=D.recs.filter(function(r){return r.date===ds});
    h+='<button class="day'+(ds===today?" today":"")+(ds===selDate?" sel":"")+'" onclick="selDay(\''+ds+'\')"><span class="n">'+d+'</span>'
     +rs.map(function(r){return '<span class="chip '+tier(r.time).cls+'">'+esc(sname(r.sid))+'</span>'}).join("")+payChips(ds)+'</button>'}
  document.getElementById("cal").innerHTML=h;
  var dt=document.getElementById("detail");
  if(!selDate){dt.innerHTML='<div class="empty">날짜를 누르면 그날 지각한 학생이 보여요.</div>';return}
  var rs=D.recs.filter(function(r){return r.date===selDate}),ps=(D.pays||[]).filter(function(p){return p.date===selDate});
  var h2='<div class="name">'+selDate.replace(/-/g,".")+'</div>';
  h2+=rs.length?rs.map(function(r){var t=tier(r.time);return '<div class="rec"><span>'+esc(sname(r.sid))+" · "+r.time.slice(0,8)+' <span class="tag '+t.cls+'">'+t.label+'</span></span><span class="b"><button onclick="editRec(\''+r.id+'\')">수정</button><button class="d" onclick="delRec(\''+r.id+'\')">삭제</button></span></div>'}).join(""):(ps.length?"":'<div class="empty">지각한 학생이 없어요.</div>');
  if(ps.length)h2+='<div class="owet" style="margin-top:8px">납부</div>'+ps.map(function(p){return '<div class="rec"><span>'+esc(sname(p.sid))+' <span class="tag pd">'+won(p.amt)+' 납부</span></span><span class="b"><button class="d" onclick="delPay(\''+p.id+'\')">취소</button></span></div>'}).join("");
  dt.innerHTML=h2}
function selDay(d){selDate=d;if(!editId)document.getElementById("fd").value=d;renderCal()}
var CLEAN="우현,건희,지호,건우,경수,민재,민준,시윤,주호,지환,하람,주원,현우,형민,시우,로,백호,재문,준기,현수,윤우,영훈,유준,윤호,우상,재이".split(","),
cdate=(function(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
function wdn(d){var t=Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),m=(t+3)%7;return (t-m-4)/7*5+Math.min(m,5)}
function canchor(){var p=(D.cs||"2026-11-02").split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function cnames(d){var n=CLEAN.length,i=wdn(d)-wdn(canchor()),off=(((4*i)%n)+n)%n;return [0,1,2,3].map(function(j){return CLEAN[(off+j)%n]})}
function cmv(n){do{cdate=new Date(cdate.getFullYear(),cdate.getMonth(),cdate.getDate()+n)}while(cdate.getDay()%6===0);renderClean()}
function csetStart(){D.cs=ymd(cdate);save();render();note("이 날부터 우현이 첫 순서예요")}
function renderClean(){
  var w=["일","월","화","수","목","금","토"],isT=ymd(cdate)===ymd(new Date());
  document.getElementById("ct").textContent=(cdate.getMonth()+1)+"월 "+cdate.getDate()+"일 ("+w[cdate.getDay()]+")"+(isT?" · 오늘":"");
  var e=document.getElementById("clean");
  if(cdate.getDay()%6===0){e.innerHTML='<div class="card empty">주말에는 청소가 없어요.</div>';return}
  var a=cnames(cdate),nx=cnames(new Date(cdate.getFullYear(),cdate.getMonth(),cdate.getDate()+1));
  function zone(t,x,y){return '<div class="card row"><span class="name">'+t+'</span><span class="amt">'+esc(x)+' · '+esc(y)+'</span></div>'}
  e.innerHTML=zone("교실",a[0],a[1])+zone("특별 구역",a[2],a[3])+'<div class="sub">다음 순서: '+nx.map(esc).join(", ")+'</div>'}
var auto=false;try{auto=localStorage.getItem("latefee_mode")==="auto"}catch(e){}
function nowT(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0")}
function tickAuto(){var n=new Date(),t=tier(nowT(n));document.getElementById("autoInfo").innerHTML='⏱ 기록하는 순간의 현재 시간으로 저장돼요<br><b>'+ymd(n)+' '+nowT(n)+'</b> '+(t.fee?'<span class="tag '+t.cls+'">'+t.label+'</span>':'<span class="sub">(지금은 지각 아님)</span>')}
function applyMode(){
  var a=auto&&!editId,sg=document.getElementById("seg");
  sg.classList.toggle("auto",auto);sg.setAttribute("aria-checked",auto?"true":"false");
  document.querySelectorAll(".mo").forEach(function(e){e.hidden=a});
  document.getElementById("autoInfo").hidden=!a;
  if(a)tickAuto()}
function toggleMode(){auto=!auto;try{localStorage.setItem("latefee_mode",auto?"auto":"manual")}catch(e){}applyMode()}
setInterval(function(){if(auto&&!editId)tickAuto()},1000);
function render(){
  var c=[0,0,0],sum=0;D.recs.forEach(function(r){var t=tier(r.time);sum+=t.fee;if(t.fee)c[t.fee/1000-2]++});
  document.getElementById("total").textContent=won(D.tot||0);
  var ow=D.students.map(function(s){return{id:s.id,n:s.name,v:stuSum(s)}}).filter(function(x){return x.v>0}).sort(function(a,b){return b.v-a.v}),oe=document.getElementById("owe");
  oe.hidden=!ow.length;oe.innerHTML=ow.length?'<div class="owet">내야 할 금액</div>'+ow.map(function(x){return '<div class="orow"><span class="on">'+esc(x.n)+'</span><span class="ov">'+won(x.v)+'</span><span class="ob"><button class="ck" onclick="payAll(\''+x.id+'\')" aria-label="완납">✓</button><button onclick="pay(\''+x.id+'\',1000)">−1,000</button><button onclick="adj(\''+x.id+'\',1000)">+1,000</button></span></div>'}).join(""):"";
  document.body.classList.toggle("edit",unlocked);document.getElementById("lockBtn").textContent=unlocked?"🔓 수정 끝내기":"🔒 수정";document.getElementById("modeTxt").textContent=unlocked?"수정 모드":"보기 전용";
  var n=c[0]+c[1]+c[2];
  document.getElementById("bar").innerHTML=n?['var(--blue)','var(--red)','var(--pur)'].map(function(col,i){return '<i style="width:'+c[i]/n*100+'%;background:'+col+'"></i>'}).join(""):"";
  renderChips();renderStudents();renderCal();renderClean();upBtn()}
document.getElementById("ft").addEventListener("input",upPrev);
document.getElementById("fd").value=ymd(new Date());
upPrev();render();applyMode();initSync();
</script>
</body>
</html>
